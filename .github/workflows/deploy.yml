name: Publish RealWorld .NET

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit that passed CI
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      RW_DOTNET_DEPLOY_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ vars.RW_DOTNET_DOCKERHUB_IMAGE }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.RW_DOTNET_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::GitHub variable DOCKERHUB_USERNAME is not configured for the production environment."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_IMAGE" ]]; then
            echo "::error::GitHub variable RW_DOTNET_DOCKERHUB_IMAGE is not configured for the production environment."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=dotnet-10-aspnetcore

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=rw-dotnet-amd64
          cache-to: type=gha,mode=max,scope=rw-dotnet-amd64,ignore-error=true
          provenance: true
          sbom: true

      - name: Trigger deployment platform
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        run: curl --fail --show-error --silent --request POST "$DEPLOY_WEBHOOK_URL"
